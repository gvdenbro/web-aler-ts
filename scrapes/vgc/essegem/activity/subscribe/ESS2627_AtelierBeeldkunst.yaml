  - text: " 2015 - 2018  GC Essegem Leopold I-straat 329, 1090 Jette  Voormiddag  ESS2627_AtelierBeeldkunst Gaat door op:  12/09/2026, 19/09/2026, 26/09/2026, 03/10/2026, 10/10/2026, 17/10/2026, 24/10/2026, 15/11/2026, 21/11/2026, 28/11/2026, 05/12/2026, 12/12/2026, 19/12/2026, 09/01/2027, 16/01/2027, 23/01/2027, 30/01/2027, 06/02/2027, 20/02/2027, 27/02/2027, 06/03/2027, 13/03/2027, 20/03/2027, 17/04/2027, 24/04/2027, 15/05/2027, 22/05/2027, 29/05/2027, 05/06/2027, 12/06/2027, 19/06/2027, 26/06/2027 Gaat niet door op:  31/10/2026, 07/11/2026, 14/11/2026, 26/12/2026, 02/01/2027, 13/02/2027, 27/03/2027, 03/04/2027, 10/04/2027, 01/05/2027, 08/05/2027  Van 10:00 tot 12:00 Prijs: € 125.00 We ontdekken hoe echte artiesten kunstwerken maken en experimenteren erop los: tekenen, schilderen, boetseren, graffiti spuiten ... We ontketenen onze creativiteit en fantasie. In het groot, in het klein, in 2D, in 3D …"
