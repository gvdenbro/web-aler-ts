  - heading "hip hip hip (1,5+) - Le Zet" [level=3]
  - figure
  - iframe
  - text: " GC Essegem Leopold I-straat 329, 1090 Jette  15/11/2026  ESS2627_familietheater1511nm  Vanaf 13:30 tot 14:20 Er is hier, er is daar. Er is binnen, er is buiten. Er zijn hoeken en vier randen. Er is rondom, er is ik, er is jij. Van de een naar de ander: kleine feestjes om te beleven, vrolijke spelletjes om te vieren. Het bijna niets dat tot alles leidt. Het hier van de wereld, van jou tot ons. En tot ver weg. ‘hip hip hip’ is een voorstelling die jonge kinderen laat spelen, ontdekken én stralen. Twee actrices laten zich inspireren door de wereld van het jonge kind: helemaal in het moment zijn, voelen wat er leeft, spelen, luisteren en op elkaar inspelen. In elk kind schuilt een vrolijk plekje dat ontdekt mag worden. Ga samen met je kleuters op pad naar dat plekje. Met liedjes, spelletjes en dansrituelen beleven jullie een verrassende en onvoorspelbare reis."
  - strong: Leuk voor kinderen vanaf 1,5 jaar én hun families. In het kader van Kunstendag voor Kinderen.
  - emphasis: Online inschrijven stopt één uur voor aanvang van de voorstelling. Voorstelling volzet? Mail of bel ons voor een plaats op de wachtlijst.
