  - text: " GC Essegem Leopold I-straat 329, 1090 Jette  15/11/2026  ESS2627_KVK26_potatoprint  Vanaf 10:00 tot 12:00 Speciaal voor Kunstendag voor kinderen opent ons wekelijks atelier beeldende kunst haar deuren. Vandaag maken we samen met Lars en Maria-Isabel potato prints: aardappelstempels! We drukken erop los: op papier, textiel… Samen ontdekken we welke vormen en patronen kunnen ontstaan. Ontketen je creativiteit en fantasie en experimenteer erop los..."
  - emphasis:
    - text: Duo-workshop, leuk voor een (groot)ouder/meter/peter/oom/tante met een kind vanaf 3 jaar.
    - emphasis: Reserveer 2 tickets, en vul op de volgende pagina de naam van het kind en jouw naam (of van de volwassene die het kind zal vergezellen) in.
  - emphasis:
    - text: Volzet? Contacteer ons voor een plaats op de wachtlijst of doe mee aan de duo-workshop '
