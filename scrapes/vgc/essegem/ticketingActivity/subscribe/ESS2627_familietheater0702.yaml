  - text:  GC Essegem Leopold I-straat 329, 1090 Jette  07/02/2027  ESS2627_familietheater0702  Vanaf 11:00 tot 11:40 Huilen, lachen, praten, zingen, slapen, kruipen, lopen, springen. Zomer na lente na winter na herfst. Voorbij? Toe … nog even! Ik heb de tijd van m’n leven. ‘Ik werd als eerste wakker’ is een speelse en warme vertelling voor de allerkleinsten over opgroeien, seizoenen en de wonderlijke ontdekking van de wereld door de ogen van een klein meisje. Een verhaal over één meisje, twee oma’s en drie … nee ... vier seizoenen! Geen particulier verhaal, maar het verhaal van ons allemaal.
