snapshot:
  - heading "SPAT! SMOS! Oeps, ik mors! (4+) - Elisa Goossens & Niels Thijs" [level=3]
  - figure
  - iframe
  - text: " GC Essegem Leopold I-straat 329, 1090 Jette  24/01/2027  ESS2627_familietheater2401vm  Vanaf 11:00 tot 12:10 Twee grijze figuren doen elke dag hun ronde. Ze speuren en snuffelen tot ze vinden wat ze zoeken: vlekken. Ze poetsen tot alles ‘spic en span’ is. Want elke vlek moet weg! Maar wanneer hun koffertjes opengaan, gebeurt er iets bijzonders ... Plots duikt er kleur op, SPAT! Vormen veranderen. SMOS! Magie kladdert in het rond. Oeps, ik mors. ‘SPAT! SMOS! Oeps, ik mors!’ is een expressieve slapstickvoorstelling vol geknoei en durf. Met een tik, een veeg, een sprongetje en een hoop verwondering krijgt de wereld van de twee figuren beetje bij beetje kleur. Ontdek hoe leuk het kan zijn om samen te mogen morsen en speel, smos en dans mee."
