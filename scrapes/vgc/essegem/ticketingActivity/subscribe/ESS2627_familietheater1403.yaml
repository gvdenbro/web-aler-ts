  - heading "Zeg maar dag (4+) - Maas theater & dans" [level=3]
  - figure
  - iframe
  - text:  GC Essegem Leopold I-straat 329, 1090 Jette  14/03/2027  ESS2627_familietheater1403  Vanaf 13:30 tot 14:20 Of het nu gaat om de peuterspeelzaal, je lievelingspotlood, dat ene vriendje, je oma of die vertrouwde plek waar je alles kent; vroeg of laat moeten we allemaal afscheid nemen. Maar hoe doe je dat eigenlijk? En wat als jij degene bent die achterblijft? ‘Zeg maar dag’ is een poëtische en muzikale voorstelling over grote gevoelens voor kleine mensen, waarin drie performers allerlei pogingen tot afscheid nemen en achterblijven doen. Ze zwaaien, verdwijnen, doen alsof ze gaan, zwaaien nog wat meer, omhelzen, zingen elkaar toe en oefenen in blijven … ook als de ander dat niet doet. Het verdriet van elkaar missen en de vreugde van elkaar weer vinden wisselen razendsnel af. Want dat wat je soms overspoelt, kan ook wegzinken, om daarna weer zachtjes boven te komen drijven. En misschien is verdriet ook gewoon maar liefde die een weg naar buiten zoekt.
  - strong: Leuk voor kinderen vanaf 4 jaar én hun families
